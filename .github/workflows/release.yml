name: Build Catalina releases

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            archive: catalina-${{ github.ref_name }}-windows-x64.zip
            executable: target/release/catalina.exe
          - name: macOS Apple Silicon
            runner: macos-15
            archive: catalina-${{ github.ref_name }}-macos-arm64.tar.gz
            executable: target/release/catalina
          - name: macOS Intel
            runner: macos-15-intel
            archive: catalina-${{ github.ref_name }}-macos-x64.tar.gz
            executable: target/release/catalina
          - name: Linux x64
            runner: ubuntu-latest
            archive: catalina-${{ github.ref_name }}-linux-x64.tar.gz
            executable: target/release/catalina
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Build Catalina
        run: cargo build --release --locked --bin catalina
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "${{ matrix.executable }}","README.md","LICENSE" package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp "${{ matrix.executable }}" README.md LICENSE package/
          tar -czf "${{ matrix.archive }}" -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
